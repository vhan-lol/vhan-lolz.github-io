
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine Pose Model</title>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f7fb;
            margin: 0;
            padding: 30px 15px;
            color: #222;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 26px;
            margin-bottom: 10px;
        }

        p {
            color: #666;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 15px 0;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        canvas {
            display: block;
            width: 100%;
            max-width: 400px;
            height: auto;
            margin: 15px auto;
            border-radius: 10px;
            background: #111;
        }

        #status {
            color: #555;
            font-size: 14px;
            margin: 10px 0;
        }

        #label-container {
            margin-top: 20px;
            text-align: left;
        }

        .prediction {
            margin: 12px 0;
        }

        .prediction-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .progress {
            width: 100%;
            height: 12px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #2563eb;
            transition: width 0.15s ease;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Teachable Machine Pose Model</h1>
        <p>Stand in front of your camera to detect your pose.</p>

        <button id="start-button" onclick="init()">Start Camera</button>

        <div id="status">Click Start Camera to begin.</div>

        <canvas id="canvas" width="200" height="200"></canvas>

        <h3>Pose Predictions</h3>
        <div id="label-container"></div>
    </div>

    <script>
        // Folder containing model.json and metadata.json
        const URL = "./my_model/";

        let model;
        let webcam;
        let ctx;
        let labelContainer;
        let maxPredictions;
        let running = false;

        async function init() {
            const button = document.getElementById("start-button");
            const status = document.getElementById("status");

            if (running) return;

            button.disabled = true;
            status.textContent = "Loading model...";

            try {
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";

                // Load the Teachable Machine pose model
                model = await tmPose.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                // Initialize webcam
                const size = 200;
                const flip = true;

                webcam = new tmPose.Webcam(size, size, flip);
                await webcam.setup();
                await webcam.play();

                // Initialize canvas
                const canvas = document.getElementById("canvas");
                canvas.width = size;
                canvas.height = size;
                ctx = canvas.getContext("2d");

                // Create prediction elements
                labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = "";

                for (let i = 0; i < maxPredictions; i++) {
                    const prediction = document.createElement("div");
                    prediction.className = "prediction";

                    prediction.innerHTML = `
                        <div class="prediction-label">
                            <span class="class-name">Class</span>
                            <span class="probability">0%</span>
                        </div>
                        <div class="progress">
                            <div class="progress-bar"></div>
                        </div>
                    `;

                    labelContainer.appendChild(prediction);
                }

                running = true;
                button.textContent = "Camera Running";
                status.textContent = "Camera active — detecting poses.";

                window.requestAnimationFrame(loop);

            } catch (error) {
                console.error(error);
                status.textContent =
                    "Unable to start. Check your model files and camera permissions.";
                button.disabled = false;
                button.textContent = "Try Again";
            }
        }

        async function loop() {
            if (!running) return;

            webcam.update();
            await predict();

            if (running) {
                window.requestAnimationFrame(loop);
            }
        }

        async function predict() {
            const { pose, posenetOutput } =
                await model.estimatePose(webcam.canvas);

            const predictions = await model.predict(posenetOutput);

            for (let i = 0; i < maxPredictions; i++) {
                const item = labelContainer.children[i];
                const probability = predictions[i].probability;
                const percent = (probability * 100).toFixed(1);

                item.querySelector(".class-name").textContent =
                    predictions[i].className;

                item.querySelector(".probability").textContent =
                    percent + "%";

                item.querySelector(".progress-bar").style.width =
                    percent + "%";
            }

            drawPose(pose);
        }

        function drawPose(pose) {
            ctx.drawImage(webcam.canvas, 0, 0);

            if (pose) {
                const minPartConfidence = 0.5;

                tmPose.drawKeypoints(
                    pose.keypoints,
                    minPartConfidence,
                    ctx
                );

                tmPose.drawSkeleton(
                    pose.keypoints,
                    minPartConfidence,
                    ctx
                );
            }
        }
    </script>
</body>

</html>
